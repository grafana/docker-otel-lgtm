---
name: Acceptance Tests

on: [pull_request]

permissions: {}

jobs:
  acceptance-test-suite:
    name: acceptance-tests (${{ matrix.name }})
    permissions: {}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: examples
            tags: examples
            parallel: 4
          - name: ebpf-profiler
            tags: ebpf-profiler
            parallel: 1
          - name: obi
            tags: obi
            parallel: 1
    steps:
      - name: Check out
        with:
          persist-credentials: false
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: v2026.8.5
          sha256: ee362b6d96c648e27325a8bc7ee866bde4fffc20c88c777c5eb5c3b5c6f3e226

      - name: Run acceptance tests
        env:
          OATS_PARALLEL: ${{ matrix.parallel }}
          OATS_TAGS: ${{ matrix.tags }}
        run: mise run acceptance-tests ${{ github.event.pull_request.head.sha }}

  # Keep the stable required-check name while running the suites concurrently.
  acceptance-tests:
    if: ${{ always() }}
    needs: acceptance-test-suite
    permissions: {}
    runs-on: ubuntu-24.04
    steps:
      - name: Verify acceptance test suites
        env:
          RESULT: ${{ needs.acceptance-test-suite.result }}
        run: test "$RESULT" = success
