---
name: Acceptance Tests

on: [pull_request]

permissions: {}

jobs:
  acceptance-test-suite:
    name: acceptance-tests (${{ matrix.name }})
    permissions: {}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: examples
            tags: examples
            parallel: 4
          - name: ebpf-profiler
            tags: ebpf-profiler
            parallel: 1
          - name: obi
            tags: obi
            parallel: 1
    steps:
      - name: Check out
        with:
          persist-credentials: false
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: v2026.9.11
          sha256: 6e39ee1ffa926a1f64814efbf1d26c3f617255e2a6ba6152e3c8a5135fa5a35f

      - name: Run acceptance tests
        env:
          OATS_PARALLEL: ${{ matrix.parallel }}
          OATS_TAGS: ${{ matrix.tags }}
        run: mise run acceptance-tests ${{ github.event.pull_request.head.sha }}

  # Keep the stable required-check name while running the suites concurrently.
  acceptance-tests:
    if: ${{ always() }}
    needs: acceptance-test-suite
    permissions: {}
    runs-on: ubuntu-24.04
    steps:
      - name: Verify acceptance test suites
        env:
          RESULT: ${{ needs.acceptance-test-suite.result }}
        run: test "$RESULT" = success
