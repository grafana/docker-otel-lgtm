---
name: CodeQL

on:
  push:
    paths-ignore:
      - "*.md"
  pull_request:
  schedule:
    - cron: "0 6 * * MON"
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-26.04

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["actions"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: "tree:0"
          persist-credentials: false
          show-progress: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          build-mode: none
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"

  codeql:
    if: ${{ !cancelled() }}
    needs: [analysis]
    runs-on: ubuntu-26.04

    steps:
      - name: Report status
        shell: bash
        env:
          SCAN_SUCCESS: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "${SCAN_SUCCESS}" == "true" ]
          then
            echo 'CodeQL analysis successful ✅'
          else
            echo 'CodeQL analysis failed ❌'
            exit 1
          fi
