services:
  # TODO: Remove this helper once OATS supports repeated successful HTTP inputs.
  # Keep producing CPU samples while the profiler attaches and OATS queries.
  generate-traffic:
    image: curlimages/curl:8.23.0@sha256:11e64e28c5f58c8d93ee95fcf22ac055f48b0bc440e0ce7d8013bbb5ad6aa8ac
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until curl -fsS --connect-timeout 2 --max-time 10 http://go:8081/rolldice >/dev/null 2>&1; do
          sleep 1
        done
        while true; do
          curl -fsS --connect-timeout 2 --max-time 10 http://go:8081/rolldice >/dev/null 2>&1 || true
          sleep 1
        done
    depends_on:
      - go

  otel-ebpf-profiler:
    build:
      context: ../../examples/ebpf-profiler
      dockerfile: Dockerfile
    command:
      [
        "-collection-agent",
        "lgtm:4317",
        "-no-kernel-version-check",
        "-disable-tls"
      ]
    hostname: ebpf-profiler
    privileged: true
    pid: "host"
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug
      - /sys/fs/cgroup:/sys/fs/cgroup
      - /proc:/proc
    depends_on:
      - lgtm

  go:
    build:
      context: ../../examples/go
      dockerfile: Dockerfile
    environment:
      OTEL_SERVICE_NAME: "rolldice"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_METRIC_EXPORT_INTERVAL: "5000" # so we don't have to wait 60s for metrics
    ports:
      - "8080:8081"
    depends_on:
      - lgtm
