---
name: Acceptance Tests

on: [pull_request]

permissions: {}

jobs:
  acceptance-test-suite:
    name: acceptance-tests (${{ matrix.name }})
    permissions: {}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: examples
            tags: examples
            parallel: 4
          - name: ebpf-profiler
            tags: ebpf-profiler
            parallel: 1
          - name: obi
            tags: obi
            parallel: 1
    steps:
      - name: Check out
        with:
          persist-credentials: false
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: v2026.10.11
          sha256: f9612efcddda0ae55b62d3b6f82a6c860d5b54ebee0807d4f1a1d578055e1607

      - name: Run acceptance tests
        env:
          OATS_PARALLEL: ${{ matrix.parallel }}
          OATS_TAGS: ${{ matrix.tags }}
        run: mise run acceptance-tests ${{ github.event.pull_request.head.sha }}

      - name: Link eBPF profiler troubleshooting guide
        if: ${{ failure() && matrix.name == 'ebpf-profiler' }}
        run: |
          guide="https://github.com/grafana/docker-otel-lgtm/blob/main/examples/ebpf-profiler/README.md"
          echo "::notice title=eBPF profiler troubleshooting::See ${guide}#troubleshooting-missing-profiles"

  # Keep the stable required-check name while running the suites concurrently.
  acceptance-tests:
    if: ${{ always() }}
    needs: acceptance-test-suite
    permissions: {}
    runs-on: ubuntu-24.04
    steps:
      - name: Verify acceptance test suites
        env:
          RESULT: ${{ needs.acceptance-test-suite.result }}
        run: test "$RESULT" = success
