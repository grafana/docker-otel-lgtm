server:
  http_listen_port: 3200
  grpc_listen_port: 9096

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "127.0.0.1:4417"
        http:
          endpoint: "127.0.0.1:4418"

memberlist:
  bind_addr: [127.0.0.1]
  bind_port: 7947

query_frontend:
  # Tempo 3 defaults to 30s, which hides new traces from search for half a minute.
  # This image is meant for development and demos, so show them sooner.
  query_end_cutoff: 5s
  search:
    # Tempo 3 defaults to 15m, which hides imported historical traces from search until then.
    query_backend_after: 1m

querier:
  frontend_worker:
    frontend_address: 127.0.0.1:9096

storage:
  trace:
    backend: local
    wal:
      path: /data/tempo/wal
    local:
      path: /data/tempo/blocks
    # Default is 5m. Poll sooner so flushed blocks show up in search quickly.
    blocklist_poll: 5s

metrics_generator:
  processor:
    span_metrics:
      dimensions:
        - service_name
        - operation
        - status_code
  storage:
    path: /data/tempo/generator/wal
    remote_write:
      - url: http://127.0.0.1:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
