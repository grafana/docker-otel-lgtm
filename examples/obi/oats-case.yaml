name: OBI multi-service emits traces and metrics
tags: [obi]
fixture:
  compose:
    template: lgtm
    file: docker-compose.oats.yml
seed:
  type: app
input:
  - compose:
      service: generate-traffic
      # Java instrumentation attaches after the app becomes healthy, so wait
      # before sending the first and only request.
      command: [sh, -c, "sleep 10; exec curl -fsS --retry 30 --retry-delay 1 --retry-all-errors http://java:8080/rolldice"]
  - compose:
      service: generate-traffic
      command: [curl, -fsS, --retry, "30", --retry-delay, "1", --retry-all-errors, http://go:8081/rolldice]
  - compose:
      service: generate-traffic
      command: [curl, -fsS, --retry, "30", --retry-delay, "1", --retry-all-errors, http://python:8082/rolldice]
  - compose:
      service: generate-traffic
      command: [curl, -fsS, --retry, "30", --retry-delay, "1", --retry-all-errors, http://dotnet:8083/rolldice]
  - compose:
      service: generate-traffic
      command: [curl, -fsS, --retry, "30", --retry-delay, "1", --retry-all-errors, http://nodejs:8084/rolldice]
expected:
  traces:
    - traceql: '{ span.url.path = "/rolldice" && span.server.port = 8080 }'
      match_spans:
        - name: GET /rolldice
    - traceql: '{ span.url.path = "/rolldice" && span.server.port = 8081 }'
      match_spans:
        - name: GET /rolldice
    - traceql: '{ span.url.path = "/rolldice" && span.server.port = 8082 }'
      match_spans:
        - name: GET /rolldice
    - traceql: '{ span.url.path = "/rolldice" && span.server.port = 8083 }'
      match_spans:
        - name: GET /rolldice
    - traceql: '{ span.url.path = "/rolldice" && span.server.port = 8084 }'
      match_spans:
        - name: GET /rolldice
  metrics:
    - promql: 'http_server_request_duration_seconds_count{http_route="/rolldice"}'
      value: '> 0'
