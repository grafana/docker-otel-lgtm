---
name: Acceptance Tests

on: [pull_request]

permissions: {}

jobs:
  acceptance-test-suite:
    name: acceptance-tests (${{ matrix.name }})
    permissions: {}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: examples
            tags: examples
            parallel: 4
          - name: ebpf-profiler
            tags: ebpf-profiler
            parallel: 1
          - name: obi
            tags: obi
            parallel: 1
    steps:
      - name: Check out
        with:
          persist-credentials: false
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: v2026.7.18
          sha256: e1fc2899f2bc7dfe9a3553f4c2d5944cf69d11b5f561545504a20f1e11cd6cc5

      - name: Run acceptance tests
        env:
          OATS_PARALLEL: ${{ matrix.parallel }}
          OATS_TAGS: ${{ matrix.tags }}
        run: mise run acceptance-tests ${{ github.event.pull_request.head.sha }}

  # Keep the stable required-check name while running the suites concurrently.
  acceptance-tests:
    if: ${{ always() }}
    needs: acceptance-test-suite
    permissions: {}
    runs-on: ubuntu-24.04
    steps:
      - name: Verify acceptance test suites
        env:
          RESULT: ${{ needs.acceptance-test-suite.result }}
        run: test "$RESULT" = success
